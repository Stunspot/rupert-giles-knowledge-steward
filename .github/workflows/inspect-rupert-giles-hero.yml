name: Inspect Rupert Giles hero artwork

on:
  push:
    paths:
      - .github/workflows/inspect-rupert-giles-hero.yml

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          image = Image.open('docs/assets/rupert-giles-hero.png').convert('RGB')
          image.resize((160, 90), Image.Resampling.LANCZOS).save(
              'docs/assets/rupert-giles-inspection.jpg',
              format='JPEG', quality=20, optimize=True, progressive=False
          )
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/rupert-giles-inspection.jpg
          git commit -m "chore: add temporary Rupert Giles artwork preview"
          git push
